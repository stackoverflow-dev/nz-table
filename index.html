<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diagramme N–Z des noyaux</title>
<meta name="color-scheme" content="light dark">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f3f5f8; --panel:#ffffff; --ink:#142030; --muted:#5b6a7c; --line:#d3dae3;
  --accent:#1f56d6; --accent-soft:#e3ebfd; --grid:rgba(20,32,48,.09);
  --stable:#1c2531; --t-stable:#ffffff;
  --bm:#2f6fe4; --bp:#e04a4a; --a:#f0b429; --sf:#2fa66b;
  --magic:rgba(31,86,214,.13);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1620; --panel:#172230; --ink:#e8eef6; --muted:#93a2b5; --line:#2a3949;
    --accent:#7aa8ff; --accent-soft:#1f3354; --grid:rgba(232,238,246,.08);
    --stable:#dde5ee; --t-stable:#101820;
    --magic:rgba(122,168,255,.16);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1620; --panel:#172230; --ink:#e8eef6; --muted:#93a2b5; --line:#2a3949;
  --accent:#7aa8ff; --accent-soft:#1f3354; --grid:rgba(232,238,246,.08);
  --stable:#dde5ee; --t-stable:#101820;
  --magic:rgba(122,168,255,.16);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;overflow:hidden;overscroll-behavior:none}
body{height:100%;background:var(--bg);color:var(--ink);
  font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#app{height:100%;display:flex;flex-direction:column}
header{position:relative;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 10px}
.search{display:flex;gap:8px}
#q{flex:1;min-width:0;height:42px;border:1px solid var(--line);background:var(--bg);color:var(--ink);
  border-radius:10px;padding:0 12px;font:inherit;font-size:16px}
#q::placeholder{color:var(--muted)}
button,select,input{font:inherit;color:inherit}
.btn{height:42px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn[aria-expanded="true"]{background:var(--accent-soft);border-color:var(--accent)}
#badge{min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--bg);font-size:12px;
  display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:18px;
  border:1px solid var(--line);background:var(--panel);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.dot{width:12px;height:12px;border-radius:3px;background:var(--dot,var(--muted))}
.sep{flex:none;width:1px;background:var(--line);margin:4px 2px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#panel{position:absolute;left:0;right:0;top:100%;background:var(--panel);border-bottom:1px solid var(--line);
  box-shadow:0 14px 28px rgba(0,0,0,.2);padding:12px;max-height:calc(100dvh - 150px);overflow:auto}
.rng{display:grid;grid-template-columns:1fr 84px 84px;gap:8px;align-items:center;margin-bottom:8px}
.rng label,.row label{color:var(--muted);font-size:14px}
.rng input,#hl{height:40px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:0 10px;font-size:16px;width:100%;min-width:0}
.row{display:grid;grid-template-columns:1fr 176px;gap:8px;align-items:center;margin-bottom:8px}
.check{display:flex;align-items:center;gap:10px;margin:12px 0 4px;min-height:36px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.actions{display:flex;gap:8px;margin-top:10px}
.actions .btn{flex:1;justify-content:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
.note{color:var(--muted);font-size:13px;margin:10px 0 0}
main{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
#count{position:absolute;top:8px;right:10px;background:var(--panel);border:1px solid var(--line);
  padding:4px 10px;border-radius:14px;font-size:13px;font-variant-numeric:tabular-nums;pointer-events:none}
.zoom{position:absolute;right:12px;bottom:34px;display:flex;flex-direction:column;gap:8px}
.zoom button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--panel);
  box-shadow:0 2px 8px rgba(0,0,0,.18);font-size:24px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.zoom svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#info{position:absolute;left:12px;bottom:34px;right:72px;max-width:460px;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 6px 20px rgba(0,0,0,.22)}
#info h2{margin:0;font-size:18px;display:flex;align-items:baseline;gap:8px;padding-right:34px}
#info h2 span{color:var(--muted);font-weight:500;font-size:16px}
#close{position:absolute;top:6px;right:6px;width:36px;height:36px;border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted)}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 8px}
.nums div{background:var(--bg);border-radius:8px;padding:6px 8px}
.nums b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.nums small,.kv small{color:var(--muted);font-size:12px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:2px 8px;font-size:14px}
.kv small{align-self:center}
@media (min-width:700px){
  header{display:flex;gap:12px;align-items:center;padding:10px 14px}
  .search{width:420px;flex:none}
  .chips{padding:0;flex:1}
  #panel{left:auto;right:14px;width:400px;top:calc(100% + 1px);border:1px solid var(--line);border-radius:0 0 12px 12px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="search">
      <input id="q" type="search" placeholder="Cs-137, uranium, Z=82, A>200…" enterkeyhint="search"
             autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Rechercher un noyau">
      <button class="btn" id="btnFilters" aria-expanded="false" aria-controls="panel">Filtres <span id="badge" hidden></span></button>
    </div>
    <div class="chips" id="chips">
      <button class="chip" data-stab="stable" aria-pressed="false" style="--dot:var(--stable)"><i class="dot"></i>Stables</button>
      <button class="chip" data-stab="radio" aria-pressed="false">Radioactifs</button>
      <span class="sep"></span>
      <button class="chip" data-g="bm" aria-pressed="false" style="--dot:var(--bm)"><i class="dot"></i>β⁻</button>
      <button class="chip" data-g="bp" aria-pressed="false" style="--dot:var(--bp)"><i class="dot"></i>β⁺ / CE</button>
      <button class="chip" data-g="a" aria-pressed="false" style="--dot:var(--a)"><i class="dot"></i>α</button>
      <button class="chip" data-g="sf" aria-pressed="false" style="--dot:var(--sf)"><i class="dot"></i>Fission</button>
    </div>
    <div id="panel" hidden>
      <div class="rng"><label for="a0">Nucléons A</label><input id="a0" type="number" inputmode="numeric" min="0" placeholder="min"><input id="a1" type="number" inputmode="numeric" min="0" placeholder="max"></div>
      <div class="rng"><label for="z0">Charge Z (protons)</label><input id="z0" type="number" inputmode="numeric" min="0" placeholder="min"><input id="z1" type="number" inputmode="numeric" min="0" placeholder="max"></div>
      <div class="rng"><label for="n0">Neutrons N</label><input id="n0" type="number" inputmode="numeric" min="0" placeholder="min"><input id="n1" type="number" inputmode="numeric" min="0" placeholder="max"></div>
      <div class="row"><label for="hl">Demi-vie</label>
        <select id="hl">
          <option value="">Toutes</option>
          <option value="0,1">&lt; 1 s</option>
          <option value="1,3600">1 s – 1 h</option>
          <option value="3600,86400">1 h – 1 jour</option>
          <option value="86400,31557600">1 jour – 1 an</option>
          <option value="31557600,Infinity">&gt; 1 an</option>
          <option value="3.15576e13,Infinity">&gt; 1 million d’années</option>
        </select></div>
      <label class="check"><input id="magic" type="checkbox"> Nombres magiques (2, 8, 20, 28, 50, 82, 126)</label>
      <div class="actions">
        <button class="btn" id="reset">Réinitialiser</button>
        <button class="btn primary" id="show">Voir les résultats</button>
      </div>
      <p class="note">Couleur = mode principal. Le coin d’une case indique un mode secondaire.</p>
    </div>
  </header>
  <main>
    <canvas id="cv" aria-label="Diagramme N–Z : une case par noyau"></canvas>
    <div id="count" aria-live="polite"></div>
    <div class="zoom">
      <button id="zin" aria-label="Zoom avant">+</button>
      <button id="zout" aria-label="Zoom arrière">−</button>
      <button id="fit" aria-label="Cadrer les résultats"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
    <div id="info" hidden>
      <button id="close" aria-label="Fermer">×</button>
      <div id="infoBody"></div>
    </div>
  </main>
</div>

  // grille
  const step = pickStep(s);
  const xL = tx, xR = tx + NMAX*s, yT = ty - ZMAX*s, yB = ty;
  ctx.strokeStyle = C.grid; ctx.lineWidth = 1; ctx.beginPath();
  for(let k = 0; k <= NMAX; k += step){ const x = Math.round(tx + k*s) + .5; if(x<0||x>W) continue; ctx.moveTo(x, Math.max(0,yT)); ctx.lineTo(x, Math.min(H,yB)); }
  for(let k = 0; k <= ZMAX; k += step){ const y = Math.round(ty - k*s) + .5; if(y<0||y>H) continue; ctx.moveTo(Math.max(0,xL), y); ctx.lineTo(Math.min(W,xR), y); }
  ctx.stroke();

  // cases
  const filt = isFiltering();
  const gap = s >= 12 ? 1 : (s >= 6 ? .5 : 0);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for(let i = 0; i < NUC.length; i++){
    const o = NUC[i];
    const x = tx + o.n*s, y = ty - (o.z+1)*s;
    if(x > W || y > H || x + s < 0 || y + s < 0) continue;
    ctx.globalAlpha = (filt && !MATCH[i]) ? .12 : 1;
    ctx.fillStyle = C[o.main];
    ctx.fillRect(x+gap/2, y+gap/2, s-gap, s-gap);
    if(o.sec && s >= 5){
      ctx.fillStyle = C[o.sec]; ctx.beginPath();
      ctx.moveTo(x+s-gap/2, y+gap/2); ctx.lineTo(x+s-gap/2, y+s-gap/2); ctx.lineTo(x+gap/2, y+s-gap/2);
      ctx.closePath(); ctx.fill();
    }
    if(s >= 14){
      ctx.fillStyle = o.main === "stable" ? C.tStable : (o.main === "a" ? "#1a1a1a" : "#ffffff");
      if(s >= 30){
        ctx.font = `700 ${Math.min(s*.4,28)}px ${FONT}`; ctx.fillText(o.sym, x+s/2, y+s*.62);
        ctx.font = `500 ${Math.min(s*.22,15)}px ${FONT}`; ctx.fillText(o.a, x+s/2, y+s*.27);
      } else {
        ctx.font = `700 ${s*.42}px ${FONT}`; ctx.fillText(o.sym, x+s/2, y+s/2+.5);
      }
    }
  }
  ctx.globalAlpha = 1;

  // nombres magiques
  if(F.magic){
    ctx.fillStyle = C.magic;
    for(const m of MAGIC){
      ctx.fillRect(tx + m*s, Math.max(0,yT), s, Math.min(H,yB) - Math.max(0,yT));
      ctx.fillRect(Math.max(0,xL), ty - (m+1)*s, Math.min(W,xR) - Math.max(0,xL), s);
    }
  }

  // sélection
  if(sel){
    const x = tx + sel.n*s, y = ty - (sel.z+1)*s;
    ctx.strokeStyle = C.ink; ctx.lineWidth = 3;
    ctx.strokeRect(x+1, y+1, Math.max(2,s-2), Math.max(2,s-2));
    ctx.strokeStyle = C.accent; ctx.lineWidth = 1.5;
    ctx.strokeRect(x-1, y-1, s+2, s+2);
  }

  // axes
  ctx.globalAlpha = .93; ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, LW, H); ctx.fillRect(0, H-BH, W, BH);
  ctx.globalAlpha = 1;
  ctx.fillStyle = C.muted; ctx.font = `12px ${FONT}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for(let k = 0; k <= NMAX; k += step){ const x = tx + (k+.5)*s; if(x > LW+10 && x < W-4) ctx.fillText(k, x, H-BH/2); }
  for(let k = 0; k <= ZMAX; k += step){ const y = ty - (k+.5)*s; if(y > 8 && y < H-BH-4) ctx.fillText(k, LW/2, y); }
  ctx.fillStyle = C.ink; ctx.font = `600 12px ${FONT}`;
  ctx.textAlign = "left"; ctx.fillText("Z ↑ protons", LW+8, 14);
  ctx.save(); ctx.globalAlpha = .9; ctx.fillStyle = C.bg;
  ctx.fillRect(0, H-BH, LW+92, BH); ctx.restore();
  ctx.fillStyle = C.ink; ctx.fillText("N → neutrons", 6, H-BH/2);
}

function resize(){
  const r = cv.getBoundingClientRect();
  dpr = Math.min(3, window.devicePixelRatio || 1);
  W = r.width; H = r.height;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  if(!inited && W > 0){ inited = true; view = fitView(null); }
  clampView(); req();
}
new ResizeObserver(resize).observe(cv);

/* ---------- déplacements / zoom ---------- */
function stopMotion(){ cancelAnimationFrame(animId); cancelAnimationFrame(inertiaId); }
function fitView(list){
  let n0=1e9,n1=-1,z0=1e9,z1=-1;
  const idx = list && list.length ? list : NUC.map((_,i)=>i);
  for(const i of idx){ const o = NUC[i]; if(o.n<n0)n0=o.n; if(o.n>n1)n1=o.n; if(o.z<z0)z0=o.z; if(o.z>z1)z1=o.z; }
  const aw = W - LW - 16, ah = H - BH - 16;
  const s = clampS(Math.min(aw/(n1-n0+1.5), ah/(z1-z0+1.5), 48));
  const cx = (n0+n1+1)/2, cz = (z0+z1+1)/2;
  const v = {s, tx:LW + (W-LW)/2 - cx*s, ty:(H-BH)/2 + cz*s};
  return v;
}
function animateTo(t, ms = 280){
  stopMotion();
  clampView(t);
  if(reduce){ view = {...t}; req(); return; }
  const f = {...view}, t0 = performance.now();
  const step = now => {
    const p = Math.min(1, (now - t0)/ms), e = 1 - Math.pow(1-p, 3);
    view.s = f.s + (t.s-f.s)*e; view.tx = f.tx + (t.tx-f.tx)*e; view.ty = f.ty + (t.ty-f.ty)*e;
    draw();
    if(p < 1) animId = requestAnimationFrame(step);
  };
  animId = requestAnimationFrame(step);
}
function zoomAt(cx, cy, f, animate){
  const s2 = clampS(view.s*f), wx = (cx-view.tx)/view.s, wy = (view.ty-cy)/view.s;
  const t = {s:s2, tx:cx - wx*s2, ty:cy + wy*s2};
  if(animate) animateTo(t, 200); else { view = t; clampView(); req(); }
}
function fitResults(){
  const list = isFiltering() ? [...MATCH.keys()].filter(i => MATCH[i]) : null;
  animateTo(fitView(list));
}

const ptrs = new Map();
let pinch = null, tapInfo = null, lastTap = null, vel = {x:0,y:0}, lastMove = 0;
const pos = e => { const r = cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);

cv.addEventListener("pointerdown", e => {
  cv.setPointerCapture(e.pointerId); stopMotion();
  const p = pos(e); ptrs.set(e.pointerId, p);
  if(ptrs.size === 1){ tapInfo = {x:p.x, y:p.y, t:performance.now(), moved:false}; vel = {x:0,y:0}; lastMove = performance.now(); }
  else if(ptrs.size === 2){
    tapInfo = null;
    const [a,b] = [...ptrs.values()], c = {x:(a.x+b.x)/2, y:(a.y+b.y)/2};
    pinch = {d0:Math.max(1,dist(a,b)), s0:view.s, wx:(c.x-view.tx)/view.s, wy:(view.ty-c.y)/view.s};
  }
});
cv.addEventListener("pointermove", e => {
  if(!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId), cur = pos(e); ptrs.set(e.pointerId, cur);
  if(ptrs.size === 1){
    const dx = cur.x-prev.x, dy = cur.y-prev.y, now = performance.now(), dt = Math.max(1, now-lastMove);
    view.tx += dx; view.ty += dy;
    vel.x = .7*vel.x + .3*dx/dt; vel.y = .7*vel.y + .3*dy/dt; lastMove = now;
    if(tapInfo && Math.hypot(cur.x-tapInfo.x, cur.y-tapInfo.y) > 8) tapInfo.moved = true;
    clampView(); req();
  } else if(ptrs.size === 2 && pinch){
    const [a,b] = [...ptrs.values()], c = {x:(a.x+b.x)/2, y:(a.y+b.y)/2};
    const s = clampS(pinch.s0*dist(a,b)/pinch.d0);
    view.s = s; view.tx = c.x - pinch.wx*s; view.ty = c.y + pinch.wy*s;
    clampView(); req();
  }
});
function endPointer(e, cancelled){
  if(!ptrs.has(e.pointerId)) return;
  const was = ptrs.size, p = pos(e); ptrs.delete(e.pointerId);
  if(was === 1){
    if(!cancelled && tapInfo && !tapInfo.moved && performance.now()-tapInfo.t < 450) handleTap(p.x, p.y);
    else if(!cancelled && tapInfo && tapInfo.moved && Math.hypot(vel.x, vel.y) > .05 && performance.now()-lastMove < 80) inertia();
  } else if(was === 2){ pinch = null; vel = {x:0,y:0}; }
  tapInfo = null;
}
cv.addEventListener("pointerup", e => endPointer(e, false));
cv.addEventListener("pointercancel", e => endPointer(e, true));
function inertia(){
  let last = performance.now();
  const step = now => {
    const dt = Math.min(32, now-last); last = now;
    view.tx += vel.x*dt; view.ty += vel.y*dt;
    const k = Math.pow(.94, dt/16); vel.x *= k; vel.y *= k;
    clampView(); draw();
    if(Math.hypot(vel.x, vel.y) > .02) inertiaId = requestAnimationFrame(step);
  };
  inertiaId = requestAnimationFrame(step);
}
function handleTap(x, y){
  const now = performance.now();
  if(lastTap && now-lastTap.t < 320 && Math.hypot(x-lastTap.x, y-lastTap.y) < 30){
    lastTap = null; zoomAt(x, y, 2.2, true); return;
  }
  lastTap = {t:now, x, y};
  const n = Math.floor((x-view.tx)/view.s), z = Math.floor((view.ty-y)/view.s);
  select(BYKEY.get(z*1000+n) || null);
}
cv.addEventListener("wheel", e => {
  e.preventDefault(); stopMotion();
  const p = pos(e); zoomAt(p.x, p.y, Math.exp(-e.deltaY*(e.ctrlKey ? .01 : .0015)), false);
}, {passive:false});

/* ---------- fiche d’un noyau ---------- */
function fmtHL(t){
  if(t < 0) return "Stable";
  if(t < 1e-3) return fr(t*1e6) + " µs";
  if(t < 1) return fr(t*1e3) + " ms";
  if(t < 60) return fr(t) + " s";
  if(t < 3600) return fr(t/60) + " min";
  if(t < 86400) return fr(t/3600) + " h";
  if(t < 31557600) return fr(t/86400) + " jours";
  const y = t/31557600;
  if(y < 1e4) return fr(y) + " ans";
  const e = Math.floor(Math.log10(y));
  return fr(y/Math.pow(10,e), 3) + "×10" + sup(e) + " ans";
}
const fmtPct = p => p < .01 ? "<0,01" : fr(p, 2);
const info = document.getElementById("info"), infoBody = document.getElementById("infoBody");
function select(o){ sel = o; renderInfo(); req(); }
function renderInfo(){
  if(!sel){ info.hidden = true; return; }
  const o = sel;
  const modes = o.stable ? "Stable" : o.modes.map(m => MODE_LABEL[m.k] + (m.p < 99.5 ? ` (${fmtPct(m.p)} %)` : "")).join(", ");
  const kids = new Set();
  for(const m of o.modes){
    let t = null;
    if(m.k === "B-") t = [o.z+1, o.a]; else if(m.k === "B+" || m.k === "EC") t = [o.z-1, o.a]; else if(m.k === "A") t = [o.z-2, o.a-4];
    if(t && SYM[t[0]-1]) kids.add(sup(t[1]) + SYM[t[0]-1]); else if(m.k === "SF") kids.add("fragments de fission");
  }
  infoBody.innerHTML =
    `<h2>${NAMES[o.z-1]}-${o.a} <span>${sup(o.a)}${o.sym}</span></h2>
     <div class="nums"><div><small>Charge Z</small><b>${o.z}</b></div><div><small>Neutrons N</small><b>${o.n}</b></div><div><small>Nucléons A</small><b>${o.a}</b></div></div>
     <div class="kv"><small>Demi-vie</small><span>${fmtHL(o.hl)}</span>
     ${o.stable ? "" : `<small>Désintégration</small><span>${modes}</span>`}
     ${kids.size ? `<small>Donne</small><span>${[...kids].join(", ")}</span>` : ""}</div>`;
  info.hidden = false;
}
document.getElementById("close").onclick = () => select(null);

/* ---------- interface ---------- */
const $ = id => document.getElementById(id);
function refresh(){ computeMatches(); req(); }
$("q").addEventListener("input", e => { F.q = e.target.value; refresh(); });
$("q").addEventListener("keydown", e => {
  if(e.key !== "Enter") return;
  e.target.blur();
  if(matchCount > 0 && matchCount < NUC.length){
    fitResults();
    if(matchCount === 1) select(NUC[MATCH.indexOf(1)]);
  }
});
document.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
  const on = b.getAttribute("aria-pressed") !== "true";
  if(b.dataset.stab){
    document.querySelectorAll("[data-stab]").forEach(x => x.setAttribute("aria-pressed", "false"));
    F.stab = on ? b.dataset.stab : null;
    b.setAttribute("aria-pressed", String(on));
  } else {
    b.setAttribute("aria-pressed", String(on));
    on ? F.groups.add(b.dataset.g) : F.groups.delete(b.dataset.g);
  }
  refresh();
}));
const numVal = id => { const v = $(id).value.trim(); return v === "" ? null : Number(v); };
["a","z","n"].forEach(k => [0,1].forEach(i => $(k+i).addEventListener("input", () => { F[k][i] = numVal(k+i); refresh(); })));
$("hl").addEventListener("change", e => { F.hl = e.target.value ? e.target.value.split(",").map(Number) : null; refresh(); });
$("magic").addEventListener("change", e => { F.magic = e.target.checked; req(); });
const panel = $("panel"), btnF = $("btnFilters");
btnF.addEventListener("click", () => {
  const open = panel.hidden; panel.hidden = !open; btnF.setAttribute("aria-expanded", String(open));
});
$("show").addEventListener("click", () => { panel.hidden = true; btnF.setAttribute("aria-expanded","false"); fitResults(); });
$("reset").addEventListener("click", () => {
  F.q = ""; F.stab = null; F.groups.clear(); F.a=[null,null]; F.z=[null,null]; F.n=[null,null]; F.hl = null;
  $("q").value = ""; $("hl").value = "";
  ["a0","a1","z0","z1","n0","n1"].forEach(id => $(id).value = "");
  document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed","false"));
  refresh();
});
$("zin").onclick = () => zoomAt(W/2, H/2, 1.8, true);
$("zout").onclick = () => zoomAt(W/2, H/2, 1/1.8, true);
$("fit").onclick = fitResults;
addEventListener("keydown", e => {
  if(e.key === "Escape"){ panel.hidden = true; btnF.setAttribute("aria-expanded","false"); select(null); }
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { readColors(); req(); });
new MutationObserver(() => { readColors(); req(); }).observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]});

readColors();
computeMatches();
</script>
</body>
